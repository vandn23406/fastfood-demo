<article class="product-card" role="button" tabindex="0" (click)="onViewDetail()" (keydown.enter)="onKeydownEnter()"
    (keydown.space)="onKeydownSpace($event)">

    <div class="thumb-wrap">
        <img [src]="item.image" [alt]="item.name" class="product-image" (error)="onImageError($event)" />
    </div>

    <div class="product-body">
        <div class="product-info">
            <h2 class="product-name">{{ item.name }}</h2>

            @if (item.ingredients?.length) {
            <p class="product-meta">{{ item.ingredients?.join(', ') }}</p>
            } @else if (item.description) {
            <p class="product-meta">{{ item.description }}</p>
            } @else {
            <p class="product-meta">Món ăn ngon, chuẩn vị, phục vụ nhanh.</p>
            }
        </div>

        <div class="product-footer">
            <strong class="product-price">{{ item.price | currency:'VND':'symbol':'1.0-0':'vi-VN' }}</strong>

            <button type="button" class="add-btn" aria-label="Thêm sản phẩm vào giỏ hàng" (click)="onAddClick($event)">
                <i class="bi bi-bag-plus" aria-hidden="true"></i>
            </button>
        </div>
    </div>
</article>
