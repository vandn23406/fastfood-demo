<header class="site-header" [class.is-overlay]="isOverlayMode" [class.is-solid]="!isOverlayMode">
    <div class="header-inner">
        <a href="/home" class="logo-link" aria-label="Logo cửa hàng">
            <img class="logo-image" src="/avatar-logo-removebg-preview.png" alt="Logo cửa hàng" />
            <span class="brand-wordmark" aria-hidden="true">
                <span class="brand-line">BOX</span>
                <span class="brand-line">&amp; BITE</span>
            </span>
        </a>

        <nav class="header-nav" aria-label="Điều hướng chính">
            <a href="/products" class="nav-link">Thực đơn</a>
            <a href="/combo" class="nav-link">Combo</a>
            <a href="/promotion" class="nav-link">Khuyến mãi</a>
            <a href="/about-us" class="nav-link">Về Box&Bite</a>
        </nav>
        <a href="/cart" class="cart-link" aria-label="Giỏ hàng">
            <i class="bi bi-cart3" aria-hidden="true"></i>
            <span class="cart-badge" aria-live="polite">{{ cartItemCount > 99 ? '99+' : cartItemCount }}</span>
        </a>
    </div>

    <div class="header-topbar" role="status" aria-live="polite">
        <div class="topbar-track">
            <span class="topbar-fire" aria-hidden="true">🔥</span>
            <span class="topbar-message topbar-message-1">
                ƯU ĐÃI KHUNG GIỜ ĂN TRƯA ⏰ Duy nhất từ 11h - 13h hàng ngày ⏰ Giảm 20% Các Combo siêu hời
            </span>
            <span class="topbar-message topbar-message-2">
                📍 BOX &amp; BITE - Fast Food | 🕒 Mở cửa 10:00 - 21:00 | 📞 Hotline: 091 882 94 92
            </span>
        </div>
    </div>
</header>
