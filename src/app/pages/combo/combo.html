<section class="products-page py-5">
    <div class="container">
        <div class="section-head mb-4">
            <p class="section-tag mb-1">Combo tiết kiệm - Chọn món linh hoạt</p>
            <h1 class="section-title mb-0">Danh sách Combo</h1>
        </div>

        @if (loading) {
        <div class="state-card">Đang tải dữ liệu combo...</div>
        }

        @if (!loading && errorMessage) {
        <div class="state-card error">{{ errorMessage }}</div>
        }

        @if (!loading && !errorMessage) {
        <div class="row product-grid gx-4 gy-5 row-cols-1 row-cols-sm-2 row-cols-lg-3">
            @for (item of combos; track item.id) {
            <div class="col">
                <app-product-card [item]="item" (viewDetail)="viewComboDetail($event)" (addClick)="onAddClick($event)">
                </app-product-card>
            </div>
            }
        </div>

        @if (!combos.length) {
        <div class="state-card mt-4">Không có combo nào.</div>
        }
        }
    </div>
</section>
